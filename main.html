<!doctype html>
<html lang="en">
    <head>
        <meta charset='utf-8'/>
        <title>Torrent</title>
        <meta http-equiv="Access-Control-Allow-Origin" content="*">
    </head>
    <body>
        <fieldset>
            <legend>Torrent Client</legend>
            <button id='add_file_btn'>Add file</button>
            <input type='file' id='torrentf' style="display:none"/>
            <div id="torrents_d">
                <ul id='torrents'></ul>
            </div>
        </fieldset>
    </body>
    <script>
        let host = '127.0.0.1';
        let port = 9191;
        let t = 'mytorrents';
        const client_link = () => `http://${host}:${port}/${t}/rpc/`;

        setInterval(async () => {
            const r = await torrent_get();
            if (!r || !r.result || !r.result.torrents) return;

            const ul = document.getElementById('torrents');
            ul.innerHTML = "";

            r.result.torrents.forEach((el) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    ID: ${el.id} | Name: ${el.name || '---'} | Status: ${el.status} |
                    Progress: ${el.percent_done}% | Down: ${el.rate_download} b/s |
                    <button onclick="removeTorrent(${el.id})">❌</button>
                `;
                ul.appendChild(li);
            });
        }, 1000);

        const fileInput = document.getElementById('torrentf');
        document.getElementById('add_file_btn').onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async () => {
                const b64 = btoa(String.fromCharCode(...new Uint8Array(reader.result)));
                await torrent_add(b64);
                fileInput.value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        async function torrent_add(b64metainfo) {
            const res = await fetch(client_link(), {
                method: "POST",
                body: JSON.stringify({ 'method': 'torrent-add', 'arguments': { 'metainfo': b64metainfo } }),
                headers: { 'Content-Type': 'application/json' }
            });
            return res.json();
        }

        async function removeTorrent(id) {
            await fetch(client_link(), {
                method: "POST",
                body: JSON.stringify({ 'method': 'torrent-remove', 'arguments': { 'ids': [id], 'delete-local-data': true } }),
                headers: { 'Content-Type': 'application/json' }
            });
        }

        async function torrent_get() {
            const res = await fetch(client_link(), {
                method: "POST",
                body: JSON.stringify({ 'method': 'torrent-get', 'arguments': { "fields": ["id", "name", "status", "rateDownload", "rateUpload", "totalSize", "percentDone"] } }),
                headers: { 'Content-Type': 'application/json' }
            });
            return res.json();
        }
    </script>
</html>
